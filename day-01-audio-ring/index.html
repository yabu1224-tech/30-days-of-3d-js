<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Audio Visualizer | Week 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 10;
            color: #ffffff;
            pointer-events: none;
        }
        #ui-overlay h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        #ui-overlay p {
            font-size: 0.85rem;
            color: #8a8a93;
        }
    </style>
    
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h1>30-Day Sprint: Project 1</h1>
        <p>Click anywhere to activate your microphone and start the visualizer</p>
    </div>
    
    <canvas id="webgl-canvas"></canvas>

    <script>
        // All JavaScript lives directly here, completely safe from browser local-file blocks
        let scene, camera, renderer, audioAnalyzer, dataArray, controls;
        const CUBE_COUNT = 64; 
        const visualCubes = [];

        function initThree() {
            const canvas = document.querySelector('#webgl-canvas');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b0b0e, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 12); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0x00ffff, 1.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            const RADIUS = 5; 
            const geometry = new THREE.BoxGeometry(0.15, 1, 0.15); 

            for (let i = 0; i < CUBE_COUNT; i++) {
                const angle = (i / CUBE_COUNT) * Math.PI * 2;

                const material = new THREE.MeshStandardMaterial({
                    color: new THREE.Color(`hsl(${(i / CUBE_COUNT) * 360}, 85%, 50%)`),
                    roughness: 0.2,
                    metalness: 0.2
                });

                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.x = Math.cos(angle) * RADIUS;
                mesh.position.z = Math.sin(angle) * RADIUS;
                mesh.position.y = 0;
                
                mesh.lookAt(0, 0, 0);
                
                scene.add(mesh);
                visualCubes.push(mesh);
            }

            // Target the global THREE class safely loaded from the script tag above
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.minDistance = 4;      
            controls.maxDistance = 25;     

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        async function initAudio() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const source = audioContext.createMediaStreamSource(stream);
                
                audioAnalyzer = audioContext.createAnalyser();
                audioAnalyzer.fftSize = CUBE_COUNT * 2; 
                
                const bufferLength = audioAnalyzer.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                source.connect(audioAnalyzer);
                
                document.querySelector('#ui-overlay p').innerText = "Microphone connected live. Drag mouse to orbit!";
            } catch (err) {
                console.error("Access to microphone failed or was denied:", err);
                document.querySelector('#ui-overlay p').innerText = "Microphone access denied. Please reload page.";
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (controls) {
                controls.update();
            }

            if (audioAnalyzer && dataArray) {
                audioAnalyzer.getByteFrequencyData(dataArray);
                
                for (let i = 0; i < visualCubes.length; i++) {
                    const audioScale = dataArray[i] / 255;
                    visualCubes[i].scale.y = (audioScale * 18) + 0.1;
                    visualCubes[i].material.emissive.setHSL((i / CUBE_COUNT), 1, audioScale * 0.4);
                }
            }

            scene.rotation.y += 0.002;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('click', () => {
            if (!audioAnalyzer) {
                initAudio();
            }
        }, { once: true });

        // Kickoff
        initThree();
    </script>
</body>
</html>cd
